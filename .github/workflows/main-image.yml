name: Publish main image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Keep the useful build summary without retaining an unused Buildx record.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

# A newer main contains every older merge, so an obsolete image publish has no
# value once the next one starts.
concurrency:
  group: main-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build identity
        id: identity
        run: echo "date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/mobius-os/mobius:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # Manual runs deliberately refresh moving system packages; pushes
          # take the fast cached path for the new source revision.
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Verify the open-source image is public
        run: |
          docker logout ghcr.io
          for attempt in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect ghcr.io/mobius-os/mobius:main; then
              exit 0
            fi
            if [ "$attempt" = 6 ]; then
              echo "ghcr.io/mobius-os/mobius:main is not public" >&2
              echo "Set the package visibility once at:" >&2
              echo "https://github.com/orgs/mobius-os/packages/container/mobius/settings" >&2
              exit 1
            fi
            sleep 5
          done
