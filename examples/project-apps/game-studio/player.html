<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playable game</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#151d2b;color:#eef6ed;font:16px/1.5 system-ui,sans-serif}main{max-width:640px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{color:#c1d0bf}canvas{display:block;width:100%;aspect-ratio:4/3;background:#101621;border:1px solid #53634f;border-radius:12px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{min-height:44px;min-width:60px;border:1px solid #718b6d;border-radius:8px;background:#253728;color:inherit;font:inherit;padding:8px 14px;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #cafa92;outline-offset:3px}
</style>
<main><h1 id="title"></h1><p>Use the direction buttons or arrow keys to reach the star.</p><canvas width="640" height="480" tabindex="0" aria-label="Game field. Move with arrow keys."></canvas><nav aria-label="Move player"><button data-dx="-1">Left</button><button data-dy="-1">Up</button><button data-dy="1">Down</button><button data-dx="1">Right</button><button id="restart">Restart</button></nav><p id="score" role="status">Stars: 0</p></main>
<script>
const scene = __SCENE__;
document.title = scene.title;document.getElementById('title').textContent=scene.title;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let x=80,y=80,score=0;
let tx=Number(scene.target?.x)||280,ty=Number(scene.target?.y)||180;
function draw(){ctx.fillStyle=scene.background||'#151d2b';ctx.fillRect(0,0,640,480);ctx.fillStyle='#f6df81';ctx.beginPath();ctx.arc(tx,ty,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=scene.playerColor||'#9fdc91';ctx.fillRect(x-12,y-12,24,24)}
function move(dx,dy){const step=Math.max(1,Math.min(80,Number(scene.step)||16));x=Math.max(12,Math.min(628,x+dx*step));y=Math.max(12,Math.min(468,y+dy*step));if(Math.hypot(x-tx,y-ty)<26){score++;tx=40+Math.random()*560;ty=40+Math.random()*400;document.getElementById('score').textContent='Stars: '+score}draw()}
document.querySelectorAll('[data-dx],[data-dy]').forEach(b=>b.onclick=()=>move(Number(b.dataset.dx)||0,Number(b.dataset.dy)||0));
canvas.onkeydown=e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}};
document.getElementById('restart').onclick=()=>{x=80;y=80;score=0;document.getElementById('score').textContent='Stars: 0';draw()};draw();
</script></html>
