<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest-ios-height-viewport.json">
  <title>iOS Fixed 100 Viewport Height</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh; margin: 0; overflow: hidden;
      position: fixed; inset: 0; background: #0d0d0d; color: white;
    }
    body { font-family: system-ui, sans-serif; }
    #root {
      width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0;
      display: grid; align-content: end; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      background: #0d0d0d;
    }
    .probe { padding: 12px; background: #1f2937; border: 1px solid #374151; font: 13px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <main id="root">
    <div class="probe">Candidate: black-translucent + viewport-fit=cover with fixed html/body at 100vh and #root at 100%.</div>
  </main>
  <script src="./metrics.js"></script>
</body>
</html>
