[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
# Mobius has one mutable /data volume; drain longer than Uvicorn's 10s grace.
numReplicas = 1
requiredMountPath = "/data"
drainingSeconds = 15
# An in-app Restart reruns the boot inside the running container (the image's
# container supervisor), so it never depends on this policy. ALWAYS still
# revives every other stop, including a clean one; the retained 3-retry cap
# bounds crash loops.
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 3
