[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
# Mobius has one mutable /data volume; drain longer than Uvicorn's 10s grace.
numReplicas = 1
requiredMountPath = "/data"
drainingSeconds = 15
# A planned restart drains and the container exits 0; ON_FAILURE would
# never revive a clean stop, leaving the instance 502ing until manual
# recovery. ALWAYS restarts every stop; max retries caps crash loops.
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
